<script>
(function () {
  var log = [], errors = [];
  window.onerror = function (m, s, l, c, e) { errors.push('window.onerror: ' + m + ' @' + (s||'').split('/').pop() + ':' + l); };
  var origErr = console.error;
  console.error = function () { errors.push('console.error: ' + Array.prototype.join.call(arguments, ' ')); origErr.apply(console, arguments); };

  function T(name, fn) {
    try { var r = fn(); log.push('PASS  ' + name + (r ? '  → ' + r : '')); }
    catch (e) { log.push('FAIL  ' + name + '  → ' + e.message); errors.push(name + ': ' + e.message); }
  }
  function assert(cond, msg) { if (!cond) throw new Error(msg || 'assert failed'); }

  function goSync(id) { location.hash = '#/' + id; WB.route(); }

  /* ↓↓↓ 全部测试放在 runAll 中，等 main.js 完成自身初始化后再执行。
     main.js 在 DOMContentLoaded 里才会注册「界面语言切换」的 wb:lang 监听器，
     若在解析阶段同步跑测试，语言切换自动重绘这条链路就测不到。 ↓↓↓ */
  function runAll() {

  /* ---------------- 统计内核 ---------------- */
  T('超几何分布归一化', function () {
    var s = 0; for (var k = 0; k <= 10; k++) s += WB.stats.dhyper(k, 10, 90, 10);
    assert(Math.abs(s - 1) < 1e-9, 'pmf 求和 = ' + s);
    return 'sum(pmf)=' + s.toFixed(12);
  });
  T('超几何上尾与下尾一致性', function () {
    var sf = WB.stats.hypergeomSf(5, 10, 90, 10);
    var lower = 0; for (var k = 0; k <= 4; k++) lower += WB.stats.dhyper(k, 10, 90, 10);
    assert(Math.abs(sf + lower - 1) < 1e-9, 'sf=' + sf + ' lower=' + lower);
    return 'P(X>=5)=' + sf.toFixed(6);
  });
  T('Pearson 完全线性 = 1', function () {
    var x = [1, 2, 3, 4, 5, 6, 7, 8], y = x.map(function (v) { return 3 * v + 2; });
    var r = WB.stats.pearson(x, y); assert(Math.abs(r.r - 1) < 1e-12, 'r=' + r.r); return 'r=' + r.r;
  });
  T('Spearman 单调非线性 = 1', function () {
    var x = [1, 2, 3, 4, 5, 6], y = x.map(function (v) { return Math.exp(v); });
    var r = WB.stats.spearman(x, y); assert(Math.abs(r.r - 1) < 1e-12, 'rho=' + r.r); return 'rho=' + r.r;
  });
  T('Kendall tau-b 完全一致 = 1', function () {
    var r = WB.stats.kendallTauB([1, 2, 3, 4, 5], [2, 4, 6, 8, 10]);
    assert(Math.abs(r.r - 1) < 1e-12, 'tau=' + r.r); return 'tau=' + r.r;
  });
  T('BH 校正单调性与范围', function () {
    var p = [0.001, 0.008, 0.039, 0.041, 0.042, 0.06, 0.074, 0.205, 0.212, 0.216];
    var q = WB.stats.pAdjust(p, 'BH');
    assert(q.every(function (v) { return v >= 0 && v <= 1; }), '越界');
    for (var i = 0; i < p.length; i++) assert(q[i] >= p[i] - 1e-12, 'q < p');
    return 'q1=' + q[0].toFixed(4) + ' q10=' + q[9].toFixed(4);
  });
  T('t 分布双侧 P 值（t=2.228, df=10 应≈0.05）', function () {
    var p = WB.stats.tTestP(2.228, 10);
    assert(Math.abs(p - 0.05) < 0.001, 'p=' + p); return 'p=' + p.toFixed(5);
  });
  T('Jacobi 特征分解重建', function () {
    var A = [[4, 1, 0], [1, 3, 1], [0, 1, 2]];
    var e = WB.stats.jacobiEigen(A);
    var tr = A[0][0] + A[1][1] + A[2][2];
    var s = e.values.reduce(function (a, b) { return a + b; }, 0);
    assert(Math.abs(tr - s) < 1e-9, '迹不等 ' + tr + ' vs ' + s);
    return 'λ=' + e.values.map(function (v) { return v.toFixed(4); }).join(', ');
  });
  T('PCA 对已知主轴数据可解释方差 > 0.95', function () {
    var X = [];
    for (var i = 0; i < 40; i++) {
      var t = i / 40 * 6;
      X.push([t + (i % 3) * 0.01, 2 * t + 0.02 * (i % 5), 0.01 * (i % 7)]);
    }
    var pr = WB.stats.pca(X, { scale: false });
    assert(pr.explained[0] > 0.95, 'PC1=' + pr.explained[0]);
    return 'PC1=' + (pr.explained[0] * 100).toFixed(2) + '%';
  });
  T('层次聚类保留全部叶节点', function () {
    var pts = [[0, 0], [0.5, 0.2], [5, 5], [5.2, 5.1], [0.2, 0.1]];
    var hc = WB.stats.hclust(pts, { metric: 'euclidean', method: 'average' });
    assert(hc.order.length === 5, 'len=' + hc.order.length);
    var s = hc.order.slice().sort(function (a, b) { return a - b; }).join(',');
    assert(s === '0,1,2,3,4', 'order=' + s);
    return 'order=[' + hc.order.join(',') + ']';
  });
  T('卡方分布上尾（χ²=3.8415, df=1 应≈0.05；χ²=7.2, df=2 应≈0.02732）', function () {
    var p1 = WB.stats.chi2Sf(3.8415, 1), p2 = WB.stats.chi2Sf(7.2, 2);
    assert(Math.abs(p1 - 0.05) < 0.0005, 'p1=' + p1);
    assert(Math.abs(p2 - 0.02732) < 0.0005, 'p2=' + p2);
    return 'p(df=1)=' + p1.toFixed(5) + '，p(df=2)=' + p2.toFixed(5);
  });
  T('F 分布上尾（F=4.9646, df=1,10 应≈0.05）', function () {
    var p = WB.stats.fTestP(4.9646, 1, 10);
    assert(Math.abs(p - 0.05) < 0.0005, 'p=' + p);
    return 'p=' + p.toFixed(5);
  });
  T('Welch t 检验（sleep 数据，R: t=−1.8608, df=17.776, p=0.07939）', function () {
    var g1 = [0.7, -1.6, -0.2, -1.2, -0.1, 3.4, 3.7, 0.8, 0.0, 2.0];
    var g2 = [1.9, 0.8, 1.1, 0.1, -0.1, 4.4, 5.5, 1.6, 4.6, 3.4];
    var r = WB.stats.welchTTest(g1, g2);
    assert(Math.abs(r.t + 1.8608) < 0.0005, 't=' + r.t);
    assert(Math.abs(r.df - 17.776) < 0.01, 'df=' + r.df);
    assert(Math.abs(r.p - 0.07939) < 0.0005, 'p=' + r.p);
    assert(Math.abs(r.mean1 - 0.75) < 1e-12 && Math.abs(r.mean2 - 2.33) < 1e-12, 'mean=' + r.mean1 + '/' + r.mean2);
    return 't=' + r.t.toFixed(4) + '，df=' + r.df.toFixed(3) + '，p=' + r.p.toFixed(5);
  });
  T('等方差 t 检验（sleep 数据，R: t=−1.8608, df=18, p=0.07919）', function () {
    var g1 = [0.7, -1.6, -0.2, -1.2, -0.1, 3.4, 3.7, 0.8, 0.0, 2.0];
    var g2 = [1.9, 0.8, 1.1, 0.1, -0.1, 4.4, 5.5, 1.6, 4.6, 3.4];
    var r = WB.stats.studentTTest(g1, g2);
    assert(r.df === 18, 'df=' + r.df);
    assert(Math.abs(r.p - 0.07919) < 0.0005, 'p=' + r.p);
    return 't=' + r.t.toFixed(4) + '，df=' + r.df + '，p=' + r.p.toFixed(5);
  });
  T('Wilcoxon 秩和检验（sleep 数据，R: U=25.5, p=0.0693）', function () {
    var g1 = [0.7, -1.6, -0.2, -1.2, -0.1, 3.4, 3.7, 0.8, 0.0, 2.0];
    var g2 = [1.9, 0.8, 1.1, 0.1, -0.1, 4.4, 5.5, 1.6, 4.6, 3.4];
    var r = WB.stats.wilcoxonRankSum(g1, g2);
    assert(Math.abs(r.U - 25.5) < 1e-9, 'U=' + r.U);
    assert(Math.abs(r.p - 0.0693) < 0.001, 'p=' + r.p);
    return 'U=' + r.U + '，z=' + r.z.toFixed(4) + '，p=' + r.p.toFixed(4);
  });
  T('单因素方差分析（PlantGrowth，R: F=4.846, p=0.01591）', function () {
    var pg = [
      [4.17, 5.58, 5.18, 6.11, 4.50, 4.61, 5.17, 4.53, 5.33, 5.14],
      [4.81, 4.17, 4.41, 3.59, 5.87, 3.83, 6.03, 4.89, 4.32, 4.69],
      [6.31, 5.12, 5.54, 5.50, 5.37, 5.29, 4.92, 6.15, 5.80, 5.26]
    ];
    var r = WB.stats.oneWayAnova(pg);
    assert(r.df1 === 2 && r.df2 === 27, 'df=' + r.df1 + ',' + r.df2);
    assert(Math.abs(r.F - 4.846) < 0.001, 'F=' + r.F);
    assert(Math.abs(r.p - 0.01591) < 0.0005, 'p=' + r.p);
    return 'F=' + r.F.toFixed(3) + '，p=' + r.p.toFixed(5);
  });
  T('Kruskal-Wallis（三组 1–9，手算 H=7.2, p=0.02732）', function () {
    var r = WB.stats.kruskalWallis([[1, 2, 3], [4, 5, 6], [7, 8, 9]]);
    assert(r.rankSum.join(',') === '6,15,24', 'rankSum=' + r.rankSum.join(','));
    assert(Math.abs(r.H - 7.2) < 1e-9, 'H=' + r.H);
    assert(Math.abs(r.p - 0.02732) < 0.0005, 'p=' + r.p);
    return 'H=' + r.H.toFixed(4) + '，p=' + r.p.toFixed(5) + '，秩和=[' + r.rankSum.join(',') + ']';
  });
  T('Kaplan-Meier 阶梯曲线与中位生存期', function () {
    var km = WB.stats.kaplanMeier([1, 2, 3, 4], [1, 1, 0, 1]);
    assert(km.curve[0].surv === 1, '起点生存率≠1：' + km.curve[0].surv);
    assert(Math.abs(km.curve[1].surv - 0.75) < 1e-12, 't=1 生存率=' + km.curve[1].surv);
    assert(Math.abs(km.curve[2].surv - 0.5) < 1e-12, 't=2 生存率=' + km.curve[2].surv);
    assert(Math.abs(km.curve[4].surv - 0) < 1e-12, 't=4 生存率=' + km.curve[4].surv);
    assert(km.median === 2, 'median=' + km.median);
    for (var i = 1; i < km.curve.length; i++) {
      assert(km.curve[i].surv <= km.curve[i - 1].surv + 1e-12, '生存率非单调下降');
    }
    assert(km.nEvents === 3 && km.nCensored === 1, 'n=' + km.nEvents + '/' + km.nCensored);
    return 'S(1)=' + km.curve[1].surv + '，S(2)=' + km.curve[2].surv + '，中位生存期=' + km.median + '，事件 ' + km.nEvents + ' / 删失 ' + km.nCensored;
  });
  T('对数秩检验（aml 数据，R survdiff: χ²=3.40, p=0.065）', function () {
    var M = [[9, 1], [13, 1], [13, 0], [18, 1], [23, 1], [28, 0], [31, 1], [34, 1], [45, 0], [48, 1], [161, 0]];
    var N = [[5, 1], [5, 1], [8, 1], [8, 1], [12, 1], [16, 0], [23, 1], [27, 1], [30, 1], [33, 1], [43, 1], [45, 1]];
    var g = [
      { time: M.map(function (a) { return a[0]; }), event: M.map(function (a) { return a[1]; }) },
      { time: N.map(function (a) { return a[0]; }), event: N.map(function (a) { return a[1]; }) }
    ];
    var r = WB.stats.logRankTest(g);
    assert(r.df === 1, 'df=' + r.df);
    assert(r.observed.join(',') === '7,11', 'observed=' + r.observed.join(','));
    assert(Math.abs(r.expected[0] - 10.689) < 0.005, 'E1=' + r.expected[0]);
    assert(Math.abs(r.chi2 - 3.3964) < 0.005, 'χ²=' + r.chi2);
    assert(Math.abs(r.p - 0.06534) < 0.001, 'p=' + r.p);
    return 'χ²=' + r.chi2.toFixed(4) + '，df=' + r.df + '，p=' + r.p.toFixed(5) + '，O/E=[' + r.observed.join(',') + ']/[' + r.expected.map(function (v) { return v.toFixed(2); }).join(',') + ']';
  });
  T('对数秩检验与手工 Mantel-Haenszel 公式一致', function () {
    var r = WB.stats.logRankTest([{ time: [1, 2], event: [1, 1] }, { time: [3, 4], event: [1, 1] }]);
    // 风险集：t=1 n=4/d=1/nA=2 → E=0.5, V=0.25；t=2 n=3/d=1/nA=1 → E=1/3, V=2/9
    // χ² = (2 − 5/6)² / (0.25 + 2/9) = 1.36111 / 0.47222 = 2.88235
    assert(Math.abs(r.chi2 - 2.88235) < 0.0005, 'χ²=' + r.chi2);
    return 'χ²=' + r.chi2.toFixed(5) + '（手算 2.88235）';
  });
  T('矩阵求逆与奇异矩阵识别', function () {
    var inv = WB.stats.invertMatrix([[4, 7], [2, 6]]);
    assert(inv, '可逆矩阵返回 null');
    assert(Math.abs(inv[0][0] - 0.6) < 1e-12 && Math.abs(inv[0][1] + 0.7) < 1e-12 &&
      Math.abs(inv[1][0] + 0.2) < 1e-12 && Math.abs(inv[1][1] - 0.4) < 1e-12, '逆矩阵元素错误');
    assert(WB.stats.invertMatrix([[1, 2], [2, 4]]) === null, '奇异矩阵未返回 null');
    return 'A⁻¹ = [[0.6, −0.7], [−0.2, 0.4]]，奇异矩阵 → null';
  });

  /* ---------------- 差异表达：数据尺度 ---------------- */
  T('数据尺度识别（非负整数 → 计数；小数或负值 → log2）', function () {
    var d = WB.diffexp.detectScale;
    assert(d([[10, 20], [30, 40]]) === 'count', '整数矩阵被判为 ' + d([[10, 20], [30, 40]]));
    assert(d([[7.1, 8.2], [9.3, 6.4]]) === 'log', '小数矩阵被判为 ' + d([[7.1, 8.2], [9.3, 6.4]]));
    assert(d([[-1, 2], [3, 4]]) === 'log', '含负值被判为 ' + d([[-1, 2], [3, 4]]));
    assert(d([[0, 1], [2, 18]]) === 'count', '含较多零值的小整数被判为 ' + d([[0, 1], [2, 18]]));
    return '整数→count，小数/负值→log，零值较多→count';
  });
  T('计数矩阵：按样本文库大小归一化为 CPM 后取 log2(CPM+1)', function () {
    var p = WB.diffexp.preprocessMatrix([[100, 200], [300, 200]], 'count');
    // 两列之和都是 400 → 列1 基因1: 100/400×1e6；基因2: 300/400×1e6
    assert(Math.abs(p.data[0][0] - Math.log2(250001)) < 1e-9, 'v=' + p.data[0][0]);
    assert(Math.abs(p.data[1][0] - Math.log2(750001)) < 1e-9, 'v=' + p.data[1][0]);
    assert(Math.abs(p.libRatio - 1) < 1e-12, 'libRatio=' + p.libRatio);
    // 深度差 4 倍的两列：同一比例应得到相同 CPM
    var q = WB.diffexp.preprocessMatrix([[100, 400]], 'count');
    assert(Math.abs(q.data[0][0] - q.data[0][1]) < 1e-9, 'CPM 未校正测序深度：' + q.data[0][0] + ' vs ' + q.data[0][1]);
    return 'log2(CPM+1) 正确，且深度差异被校正（' + q.data[0][0].toFixed(3) + ' = ' + q.data[0][1].toFixed(3) + '）';
  });
  T('原始信号强度：逐值取 log2(x+1)', function () {
    var p = WB.diffexp.preprocessMatrix([[0, 3]], 'linear');
    assert(p.data[0][0] === 0, 'log2(1)=' + p.data[0][0]);
    assert(Math.abs(p.data[0][1] - 2) < 1e-12, 'log2(4)=' + p.data[0][1]);
    return '0→0，3→2';
  });
  /* ---------------- 新增统计检验 ---------------- */
  T('t 分布分位数：95% 临界值与统计表一致', function () {
    var q = WB.stats.invTDist;
    assert(Math.abs(q(10, 0.05) - 2.228139) < 1e-5, 'df=10 → ' + q(10, 0.05));
    assert(Math.abs(q(5, 0.05) - 2.570582) < 1e-5, 'df=5 → ' + q(5, 0.05));
    assert(Math.abs(q(20, 0.05) - 2.085963) < 1e-5, 'df=20 → ' + q(20, 0.05));
    assert(Math.abs(q(1e8, 0.05) - 1.959964) < 1e-3, 'df=∞ → ' + q(1e8, 0.05));
    return 't(10)=2.2281，t(5)=2.5706，t(20)=2.0860，t(∞)=1.9600';
  });
  T('线性回归：斜率、截距、R² 与 95% 置信带半宽', function () {
    var m = WB.stats.linearRegression([1, 2, 3, 4, 5], [2, 4, 5, 4, 5]);
    assert(Math.abs(m.slope - 0.6) < 1e-12, 'slope=' + m.slope);
    assert(Math.abs(m.intercept - 2.2) < 1e-12, 'intercept=' + m.intercept);
    assert(Math.abs(m.r2 - 0.6) < 1e-12, 'R²=' + m.r2);
    assert(m.df === 3, 'df=' + m.df);
    // 置信带在 x̄ 处最窄，预测带比置信带宽
    assert(m.seFit(m.xMean) < m.seFit(1.5), '置信带未在 x̄ 处取最窄');
    assert(m.sePred(3) > m.seFit(3), '预测带未宽于置信带');
    var half = WB.stats.invTDist(m.df, 0.05) * m.seFit(1.5);
    assert(half > 0 && isFinite(half), '置信带半宽=' + half);
    return 'ŷ = 2.2 + 0.6x，R²=0.6，x=1.5 处 95% 置信带半宽 ' + half.toFixed(3);
  });
  T('配对 t 检验与 Wilcoxon 符号秩检验', function () {
    var x = [1.83, 0.50, 1.62, 2.48, 1.68, 1.88, 1.55, 3.06, 1.30];
    var y = [0.878, 0.647, 0.598, 2.05, 1.06, 1.29, 1.06, 3.14, 1.29];
    var pt = WB.stats.pairedTTest(x, y);
    assert(Math.abs(pt.t - 3.035472) < 1e-4, 't=' + pt.t);
    assert(Math.abs(pt.p - 0.016177) < 1e-4, 'p=' + pt.p);
    var ws = WB.stats.wilcoxonSignedRank(x, y);
    assert(ws.Wp === 40, '正秩和 V=' + ws.Wp + '（R 给出 V = 40）');
    assert(ws.p > 0.02 && ws.p < 0.06, 'Wilcoxon p=' + ws.p);
    return '配对 t = 3.0355（p = 0.0162），Wilcoxon V = 40（p ≈ ' + ws.p.toFixed(4) + '）';
  });
  T('Shapiro-Wilk 与 D’Agostino-Pearson 正态性检验', function () {
    var sw = WB.stats.shapiroWilk, dp = WB.stats.dagostinoPearson;
    // 构造明显非正态数据：单调坍缩 + 强离群
    var badly = [0.01, 0.12, 0.35, 0.71, 1.02, 1.55, 2.40, 3.80, 6.10, 12.5, 40.0];
    var s2 = sw(badly), d2 = dp(badly);
    assert(s2.W < 0.85, '非正态样本 W=' + s2.W);
    assert(s2.p < 0.01, '非正态样本 SW p=' + s2.p);
    assert(d2.p < 0.05, '非正态样本 K² p=' + d2.p);

  T('富集分析：富集网络图交互（拖拽避让 / 悬停高亮 / 双击重置）', function () {
    var div = document.createElement('div');
    document.body.appendChild(div);
    var mk = function (term, genes, k) {
      return { term: term, description: term, overlap: k, setSize: 30, expected: 2,
        p: 0.001, padj: 0.01, negLogP: 2, overlapGenes: genes };
    };
    var rows = [
      mk('T_A', ['G1', 'G2', 'G3', 'G4'], 4),
      mk('T_B', ['G1', 'G2', 'G3', 'G5'], 4),
      mk('T_C', ['G6', 'G7', 'G8'], 3)
    ];
    var svg = WB.enrichment.drawEnrichMap(div, rows, { pCut: 0.05 });
    assert(svg && /svg/i.test(svg.tagName), '应返回 svg');
    var circles = div.querySelectorAll('circle[data-role=node]');
    assert(circles.length === 3, '节点数应为 3，实际 ' + circles.length);
    var c0 = circles[0];
    var x0 = +c0.getAttribute('cx');
    function ev(type, x, y) {
      return new MouseEvent(type, { bubbles: true, cancelable: true, clientX: x, clientY: y, button: 0 });
    }
    /* 拖拽：jsdom 的 getBoundingClientRect 宽高为 0，走 viewBox 兜底坐标换算 */
    c0.dispatchEvent(ev('pointerdown', 100, 100));
    svg.dispatchEvent(ev('pointermove', 260, 160));
    var x1 = +c0.getAttribute('cx');
    assert(x1 !== x0, '拖拽后节点应移动：' + x0 + ' → ' + x1);
    svg.dispatchEvent(ev('pointerup', 260, 160));
    /* 悬停高亮：与 T_A 无连线的 T_C 应变淡，移开后恢复 */
    c0.dispatchEvent(ev('pointerenter', 0, 0));
    assert(+circles[2].getAttribute('fill-opacity') < 0.5, '无连线的节点悬停时应变淡');
    c0.dispatchEvent(ev('pointerleave', 0, 0));
    assert(+circles[2].getAttribute('fill-opacity') > 0.8, '移开后应恢复');
    /* 双击空白处恢复初始布局 */
    svg.dispatchEvent(new MouseEvent('dblclick', { bubbles: true }));
    assert(Math.abs(+c0.getAttribute('cx') - x0) < 0.5, '双击后应恢复初始位置');
    div.parentNode.removeChild(div);
    return '拖拽 ' + x0.toFixed(0) + '→' + x1.toFixed(0) + ' px；高亮/恢复/双击重置均正常';
  });

  /* ---------------- 英文模式中文残留探针 ---------------- */
  /*
    示例数据本身含中文（如示例基因集描述），属数据而非界面。
    因此先收集「示例数据中出现过的完整字符串」，从扫描文本中整段扣除后，
    再检查是否仍有中文残留 —— 这样不会把未翻译的界面文案误当成数据放过去。
  */
  function demoZhPool() {
    var pool = [];
    function add(s) {
      if (s && s.length >= 2 && /[\u4e00-\u9fa5]/.test(s)) pool.push(s);
    }
    (function walk(v) {
      if (typeof v === 'string') {
        add(v);
        v.split(/[\t\r\n,;|]+/).forEach(function (tk) { add(tk.trim()); });
      } else if (v && Object.prototype.toString.call(v) === '[object Object]') {
        for (var k in v) if (Object.prototype.hasOwnProperty.call(v, k)) walk(v[k]);
      } else if (Object.prototype.toString.call(v) === '[object Array]') {
        for (var i = 0; i < v.length; i++) walk(v[i]);
      }
    })(WB.demo);
    pool.sort(function (a, b) { return b.length - a.length; });
    return pool;
  }

  T('英文模式：18 个模块界面无中文残留', function () {
    var orig = WB.i18n.getLang();
    var zhRuns = demoZhPool();
    var leftovers = [], broken = [];

    function scan(root, mod, bucket) {
      if (!root) return;
      var walker = document.createTreeWalker(root, NodeFilter.SHOW_TEXT, null, false);
      var node;
      while ((node = walker.nextNode())) {
        var txt = node.nodeValue;
        if (!txt || !/[\u4e00-\u9fa5]/.test(txt)) continue;
        zhRuns.forEach(function (t) { if (t) txt = txt.split(t).join(' '); });
        var left = txt.match(/[\u4e00-\u9fa5]+/g);
        if (!left) continue;
        var p = node.parentNode;
        var where = p ? (p.className || p.tagName || '?') : '?';
        if (p && p.getAttribute && p.getAttribute('data-x')) where += '[' + p.getAttribute('data-x') + ']';
        if (bucket.length < 120) bucket.push(mod + ' .' + where + ' → ' + left.join('/') + '   〈' + node.nodeValue.replace(/\s+/g, ' ').trim().slice(0, 60) + '〉');
      }
    }

    WB.i18n.setLang('en');
    /* 首页与「使用说明」页也纳入扫描 */
    goSync('home');
    scan(document.getElementById('main'), 'home', leftovers);
    goSync('about');
    scan(document.getElementById('main'), 'about', leftovers);
    E2E.forEach(function (spec) {
      try {
        var r = runTool(spec.id);
        if (r.stats < 3) broken.push(spec.id + ':统计条缺失');
      } catch (e) {
        broken.push(spec.id + ':' + e.message);
        return;
      }
      var main = document.getElementById('main');
      scan(main.querySelector('.page-head'), spec.id, leftovers);
      scan(document.querySelector('.nav'), spec.id, leftovers);
      scan(document.getElementById(spec.id + '-result'), spec.id, leftovers);
      /* 输入面板的「格式说明」默认只展开首个标签，需逐个切换后再扫描 */
      var tabs = main.querySelectorAll('.card-input .fmt-tab');
      if (tabs.length) {
        for (var ti = 0; ti < tabs.length; ti++) {
          tabs[ti].click();
          scan(main.querySelector('.card-input'), spec.id + ' 格式说明#' + (ti + 1), leftovers);
        }
      } else {
        scan(main.querySelector('.card-input'), spec.id, leftovers);
      }
    });
    WB.i18n.setLang(orig);

    assert(broken.length === 0, '英文模式下模块运行异常：' + broken.join('；'));
    assert(leftovers.length === 0, '英文模式下仍有中文残留：\n' + leftovers.join('\n'));
    return '首页 + 说明页 + 18 个模块的英文界面与图形文字全部去中文（已扣除 ' + zhRuns.length + ' 段示例数据中文）';
  });

  /* ---------------- 界面语言（切换后自动重绘） ---------------- */
  T('语言切换：切换后界面与图形按新语言同步重绘', function () {
    var orig = WB.i18n.getLang();
    WB.i18n.setLang('zh');
    goSync('volcano');
    var main = document.getElementById('main');
    main.querySelector('.card-foot .btn-primary').click();
    var zhSvg = document.getElementById('volcano-result').querySelector('svg');
    assert(zhSvg, '中文图未生成');
    var zhText = zhSvg.textContent;
    assert(/[\u4e00-\u9fa5]/.test(zhText), '中文模式下图形内无中文');

    WB.i18n.setLang('en');  // 派发 wb:lang → 自动重路由并重算
    var enSvg = document.getElementById('volcano-result').querySelector('svg');
    assert(enSvg, '英文图未生成');
    var enText = enSvg.textContent;
    assert(enText !== zhText, '切换语言后图形文字未变化');
    assert(!/[\u4e00-\u9fa5]/.test(enText.replace(/[\u4e00-\u9fa5]+_[\w]+/g, '')), '英文模式下仍残留中文标签');

    WB.i18n.setLang(orig);
    goSync('volcano');
    return '中文图形 ' + zhText.length + ' 字符 → 英文图形 ' + enText.length + ' 字符，重绘生效';
  });

  /* ---------------- 交互补充 ---------------- */
  T('韦恩图：交集明细表可导出', function () {
    goSync('venn');
    var main = document.getElementById('main');
    main.querySelector('.card-foot .btn-primary').click();
    var res = document.getElementById('venn-result');
    var rows = res.querySelectorAll('.data-table tbody tr').length;
    var dlBtns = res.querySelectorAll('.data-table tbody .btn').length;
    assert(rows >= 3, '明细表行数=' + rows);
    assert(dlBtns === rows, '下载按钮数 ' + dlBtns + ' ≠ 行数 ' + rows);
    var tn = res.querySelectorAll('.data-table tbody tr td:first-child');
    var first = tn.length ? tn[0].textContent : '';
    return rows + ' 个交集区域，首个：' + first;
  });
  T('相关性：分类/聚类切换后图形正常', function () {
    goSync('correlation');
    var main = document.getElementById('main');
    var sels = main.querySelectorAll('.params-grid select');
    var target = null;
    for (var i = 0; i < sels.length; i++) if (/ward/.test(sels[i].innerHTML)) target = sels[i];
    assert(target, '未找到聚类下拉');
    target.value = 'none';
    target.dispatchEvent(new Event('change'));
    main.querySelector('.card-foot .btn-primary').click();
    var res = document.getElementById('correlation-result');
    var n1 = res.querySelectorAll('svg').length;
    target.value = 'average';
    target.dispatchEvent(new Event('change'));
    main.querySelector('.card-foot .btn-primary').click();
    var n2 = res.querySelectorAll('svg').length;
    assert(n2 >= 3, 'svg 数量不足');
    return '不聚类 ' + n1 + ' 个 SVG，聚类后 ' + n2 + ' 个 SVG';
  });
  T('火山图：切换 P 值列', function () {
    goSync('volcano');
    var main = document.getElementById('main');
    var sels = main.querySelectorAll('.params-grid select');
    var target = null;
    for (var i = 0; i < sels.length; i++) if (/padj/.test(sels[i].innerHTML)) target = sels[i];
    target.value = 'pvalue';
    target.dispatchEvent(new Event('change'));
    main.querySelector('.card-foot .btn-primary').click();
    var res = document.getElementById('volcano-result');
    assert(res.querySelector('.data-table tbody tr'), '表格为空');
    return '使用原始 pvalue 重绘成功';
  });
  T('UpSet：排序方式切换', function () {
    goSync('upset');
    var main = document.getElementById('main');
    var sels = main.querySelectorAll('.params-grid select');
    var target = null;
    for (var i = 0; i < sels.length; i++) if (/degree/.test(sels[i].innerHTML)) target = sels[i];
    target.value = 'degree';
    target.dispatchEvent(new Event('change'));
    main.querySelector('.card-foot .btn-primary').click();
    var res = document.getElementById('upset-result');
    assert(res.querySelectorAll('svg circle').length > 5, '点阵未绘制');
    return '按集合数排序 OK，点阵节点 ' + res.querySelectorAll('svg circle').length;
  });
  T('热图：单行分组注释解析', function () {
    var r = parseGroupSpecForTest('Group\tNormal\tNormal\tTumor\tTumor', ['a', 'b', 'c', 'd']);
    assert(r && r.labels.join(',') === 'Normal,Normal,Tumor,Tumor', 'labels=' + (r && r.labels.join(',')));
    return 'labels=' + r.labels.join(',') + '，图例 ' + r.legend.length + ' 组';
  });
  function parseGroupSpecForTest(t, cols) {
    // 复用热图模块内部逻辑的等价实现（保持行为一致）
    var lines = t.split(/\r?\n/).filter(function (l) { return l.trim(); });
    var first = lines[0].split(/[\t,;]/).map(function (s) { return s.trim(); });
    var toks = first.slice();
    if (toks.length === cols.length + 1 && /^(group|分组|group_name|condition)$/i.test(toks[0])) toks.shift();
    var labels = toks.slice(0, cols.length);
    var names = [], counts = {};
    labels.forEach(function (l) { if (names.indexOf(l) < 0) { names.push(l); counts[l] = 0; } counts[l]++; });
    return { labels: labels, legend: names.map(function (n) { return { name: n, n: counts[n] }; }) };
  }

  /* ---------------- 导出 ---------------- */
  var out = document.getElementById('test-output');
  var pass = log.filter(function (l) { return l.indexOf('PASS') === 0; }).length;
  var fail = log.filter(function (l) { return l.indexOf('FAIL') === 0; }).length;
  out.textContent = '===SUMMARY=== total=' + log.length + ' pass=' + pass + ' fail=' + fail +
    ' errors=' + errors.length + '\n' + log.join('\n') +
    (errors.length ? '\n--- ERRORS ---\n' + errors.join('\n') : '\n--- NO ERRORS ---');
  document.title = 'SELFTEST pass=' + pass + ' fail=' + fail + ' err=' + errors.length;

  }  /* runAll 结束 */

  if (document.readyState === 'loading') {
    document.addEventListener('DOMContentLoaded', runAll);
  } else {
    runAll();
  }
})();
